{% extends 'base.html' %}
{% block title %}Cargar foto facial{% endblock %}
{% block content %}
<section class="form-card">
  <p class="eyebrow">Registro facial</p>
  <h1>Cargar foto facial</h1>
  <p>Empleado: <strong>{{ employee.full_name }}</strong> (ID {{ employee.id }}). Elegí una foto con exactamente un rostro, de frente y con buena iluminación.</p>
  <form method="post" enctype="multipart/form-data" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Foto facial
      <small>JPG o PNG, hasta 5 MB. Desde el celular podés tomarla directamente.</small>
      <input name="photo" type="file" accept="image/png,image/jpeg" capture="user" required>
    </label>
    <div class="form-actions">
      <a href="{{ url_for('employees') }}">Cancelar</a>
      <button class="button" type="submit">Guardar foto facial</button>
    </div>
  </form>
</section>
{% endblock %}
